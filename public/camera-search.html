<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍照搜图</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f4f5f7;
    --panel-alt: #eef1f6;
    --border: #dde1e8;
    --text: #1a1d24;
    --muted: #6b7280;
    --accent: #3f6fd6;
    --accent-dark: #2f56b0;
    --ok: #2e9e5b;
    --warn: #d98a1f;
    --danger: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    max-width: 560px;
    margin: 0 auto;
  }
  header { margin-bottom: 16px; }
  header h1 { font-size: 22px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  header p { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.6; }

  .preview-stage {
    position: relative;
    width: 100%;
    min-height: 220px;
    background: var(--panel);
    border: 1.5px dashed var(--border);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
    overflow: hidden;
    padding: 20px;
    text-align: center;
  }
  .preview-stage.has-media { border-style: solid; padding: 0; background: #000; aspect-ratio: 4/3; }
  .preview-stage .big-icon { font-size: 44px; opacity: 0.5; }
  .preview-stage .hint-text { color: var(--muted); font-size: 13px; }
  #camera-feed, #captured-preview {
    display: none;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .controls button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  #capture-btn { background: var(--accent); color: #fff; }
  #capture-btn:hover { background: var(--accent-dark); }
  #capture-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  #gallery-btn { background: var(--panel-alt); color: var(--text); }
  #gallery-btn:hover { background: var(--border); }
  #snap-btn { background: var(--accent); color: #fff; display: none; }
  #snap-btn:hover { background: var(--accent-dark); }
  #retake-btn {
    display: none;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border) !important;
  }
  #retake-btn:hover { border-color: var(--accent); color: var(--accent); }
  #switch-camera-btn {
    display: none;
    flex: 0 0 auto;
    width: 46px;
    background: var(--panel-alt);
    color: var(--muted);
    font-size: 17px;
  }
  #switch-camera-btn:hover { background: var(--border); }

  .zoom-row {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  .zoom-row.show { display: flex; }
  .zoom-row .zoom-icon { font-size: 15px; flex-shrink: 0; }
  .zoom-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .zoom-row .zoom-value {
    flex-shrink: 0;
    font-size: 12px;
    color: var(--muted);
    min-width: 34px;
    text-align: right;
  }

  #status-msg {
    display: none;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  #status-msg.show { display: block; }
  #status-msg.success { background: rgba(46, 158, 91, 0.12); color: var(--ok); border: 1px solid rgba(46, 158, 91, 0.3); }
  #status-msg.warn { background: rgba(217, 138, 31, 0.12); color: var(--warn); border: 1px solid rgba(217, 138, 31, 0.3); }
  #status-msg.error { background: rgba(229, 83, 75, 0.1); color: var(--danger); border: 1px solid rgba(229, 83, 75, 0.3); }

  .search-row { margin-bottom: 10px; }
  .search-row button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    background: var(--ok);
    color: #fff;
  }
  .search-row button:hover { filter: brightness(0.95); }
  .search-row button:disabled {
    background: var(--border);
    color: var(--muted);
    cursor: not-allowed;
  }

  .action-row {
    display: none;
    gap: 8px;
    margin-bottom: 10px;
  }
  .action-row.show { display: flex; }
  .action-row button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
  .action-row button:hover { border-color: var(--accent); color: var(--accent); }

  .hint-box {
    background: var(--panel);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
</style>
</head>
<body>

<header>
  <h1>📷 拍照搜图</h1>
  <p>用摄像头拍照或选相册里的图，拍完会自动准备好一个谷歌"以图搜图"链接，点绿色按钮直接新标签页打开搜索结果；同时也会自动保存一份到本地下载文件夹、顺手尝试复制到剪贴板，遇到只支持"选择文件"或者支持粘贴的网站也都能用。</p>
</header>

<div id="status-msg"></div>

<div class="preview-stage" id="preview-stage">
  <span class="big-icon">📷</span>
  <span class="hint-text" id="placeholder-text">点"拍照"打开摄像头，或从相册选一张</span>
  <video id="camera-feed" autoplay playsinline muted></video>
  <img id="captured-preview" alt="拍摄或选择的照片" />
</div>

<div class="controls">
  <button id="switch-camera-btn" title="切换前后摄像头">🔄</button>
  <button id="capture-btn">📷 拍照</button>
  <button id="snap-btn">📸 确认拍摄</button>
  <button id="gallery-btn">🖼️ 从相册选择</button>
</div>
<div class="zoom-row" id="zoom-row">
  <span class="zoom-icon">🔍</span>
  <input type="range" id="zoom-slider" min="1" max="1" step="0.1" value="1" />
  <span class="zoom-value" id="zoom-value">1.0x</span>
</div>
<button id="retake-btn" style="width:100%; margin-bottom:14px;">重新拍 / 重新选</button>

<div class="search-row" id="search-row">
  <button id="search-google-btn" disabled>⏳ 正在准备搜索链接…</button>
</div>

<div class="action-row" id="action-row">
  <button id="redownload-btn">再存一次到本地</button>
  <button id="recopy-btn">再试一次复制到剪贴板</button>
</div>

<input type="file" id="gallery-input" accept="image/*" style="display:none" />
<canvas id="capture-canvas" style="display:none;"></canvas>

<div class="hint-box">
  点"拍照"会打开摄像头实时画面（电脑摄像头/手机摄像头都支持），对准要搜索的商品后点"确认拍摄"完成拍照；拍照用的是浏览器的高质量抓拍接口，比普通截取视频画面清晰。第一次使用需要允许浏览器访问摄像头。
</div>

<script>
  const previewStage = document.getElementById('preview-stage');
  const placeholderIcon = previewStage.querySelector('.big-icon');
  const placeholderText = document.getElementById('placeholder-text');
  const cameraFeed = document.getElementById('camera-feed');
  const capturedPreview = document.getElementById('captured-preview');
  const captureBtn = document.getElementById('capture-btn');
  const snapBtn = document.getElementById('snap-btn');
  const galleryBtn = document.getElementById('gallery-btn');
  const retakeBtn = document.getElementById('retake-btn');
  const switchCameraBtn = document.getElementById('switch-camera-btn');
  const zoomRow = document.getElementById('zoom-row');
  const zoomSlider = document.getElementById('zoom-slider');
  const zoomValue = document.getElementById('zoom-value');
  const galleryInput = document.getElementById('gallery-input');
  const statusMsg = document.getElementById('status-msg');
  const actionRow = document.getElementById('action-row');
  const redownloadBtn = document.getElementById('redownload-btn');
  const recopyBtn = document.getElementById('recopy-btn');
  const searchGoogleBtn = document.getElementById('search-google-btn');
  const captureCanvas = document.getElementById('capture-canvas');

  let stream = null;
  let imageCapture = null;
  let facingMode = 'environment';
  let currentFile = null;

  function showStatus(text, type) {
    statusMsg.textContent = text;
    statusMsg.className = 'show ' + type;
  }
  function hideStatus() {
    statusMsg.className = '';
  }

  function hidePlaceholder() {
    placeholderIcon.style.display = 'none';
    placeholderText.style.display = 'none';
  }
  function showPlaceholder(text) {
    placeholderIcon.style.display = 'block';
    placeholderText.style.display = 'block';
    placeholderText.textContent = text;
  }

  async function openCamera() {
    hideStatus();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('这个浏览器不支持调用摄像头，用"从相册选择"导入已有照片吧', 'error');
      return;
    }
    try {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false,
      });
      cameraFeed.srcObject = stream;
      cameraFeed.style.display = 'block';
      capturedPreview.style.display = 'none';
      previewStage.classList.add('has-media');
      hidePlaceholder();

      const track = stream.getVideoTracks()[0];
      imageCapture = (typeof ImageCapture !== 'undefined') ? new ImageCapture(track) : null;

      setupZoomControl(track);

      captureBtn.style.display = 'none';
      snapBtn.style.display = 'block';
      galleryBtn.style.display = 'none';
      switchCameraBtn.style.display = 'block';
    } catch (err) {
      let msg = '无法打开摄像头：' + (err.message || err.name || '未知错误');
      if (err.name === 'NotAllowedError') {
        msg = '摄像头权限被拒绝了，去浏览器设置里允许这个网站访问摄像头，然后重新点"拍照"';
      } else if (err.name === 'NotFoundError') {
        msg = '没有找到可用的摄像头设备，可以用"从相册选择"导入已有照片';
      }
      showStatus(msg, 'error');
      showPlaceholder('摄像头打不开');
    }
  }

  let currentTrack = null;

  function setupZoomControl(track) {
    currentTrack = track;
    // 变焦（数字/光学变焦）不是所有摄像头都支持，得先问一下这个摄像头的硬件能力里有没有zoom这一项，
    // 没有的话就把滑块整个藏起来，不能摆一个按了没反应的控件在那里
    const capabilities = (typeof track.getCapabilities === 'function') ? track.getCapabilities() : null;
    if (!capabilities || !capabilities.zoom) {
      zoomRow.classList.remove('show');
      return;
    }
    const { min, max, step } = capabilities.zoom;
    zoomSlider.min = min;
    zoomSlider.max = max;
    zoomSlider.step = step || 0.1;
    const settings = (typeof track.getSettings === 'function') ? track.getSettings() : {};
    const current = (settings && typeof settings.zoom === 'number') ? settings.zoom : min;
    zoomSlider.value = current;
    zoomValue.textContent = current.toFixed(1) + 'x';
    zoomRow.classList.add('show');
  }

  async function applyZoom(value) {
    if (!currentTrack) return;
    try {
      await currentTrack.applyConstraints({ advanced: [{ zoom: Number(value) }] });
      zoomValue.textContent = Number(value).toFixed(1) + 'x';
    } catch (err) {
      // 极少数摄像头虽然声明支持zoom能力，但实际设置时仍可能失败，
      // 这种情况静默忽略就行，不用打断用户拍照流程弹出一堆报错
    }
  }

  zoomSlider.addEventListener('input', (e) => applyZoom(e.target.value));

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
    imageCapture = null;
    currentTrack = null;
    zoomRow.classList.remove('show');
  }

  async function snapPhoto() {
    if (!stream) return;
    let blob = null;

    if (imageCapture && imageCapture.takePhoto) {
      try {
        blob = await imageCapture.takePhoto();
      } catch (err) {
        blob = null;
      }
    }

    if (!blob) {
      captureCanvas.width = cameraFeed.videoWidth;
      captureCanvas.height = cameraFeed.videoHeight;
      captureCanvas.getContext('2d').drawImage(cameraFeed, 0, 0);
      blob = await new Promise((resolve) => captureCanvas.toBlob(resolve, 'image/png'));
    }

    if (!blob) {
      showStatus('拍照失败，请重试', 'error');
      return;
    }

    const file = new File([blob], `拍照-${Date.now()}.png`, { type: blob.type || 'image/png' });
    stopCamera();
    handleNewFile(file);
  }

  function downloadFile(file) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file);
    const ext = (file.type && file.type.includes('png')) ? 'png' : 'jpg';
    a.download = `拍照搜图-${Date.now()}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  async function copyFileToClipboard(file) {
    if (!navigator.clipboard || !window.ClipboardItem) {
      throw new Error('浏览器不支持图片剪贴板API');
    }
    const pngBlob = await convertToPng(file);
    await navigator.clipboard.write([
      new ClipboardItem({ 'image/png': pngBlob }),
    ]);
  }

  function convertToPng(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob((blob) => {
          if (blob) resolve(blob); else reject(new Error('图片转换失败'));
        }, 'image/png');
        URL.revokeObjectURL(img.src);
      };
      img.onerror = () => reject(new Error('图片读取失败'));
      img.src = URL.createObjectURL(file);
    });
  }

  // 把图片传到咱们自己的服务器，拿到一个公开可访问的网址，
  // 再拼成谷歌"以图搜图"的官方链接格式——谷歌那边收到这个链接后会自动去抓这张图来搜，
  // 不用再手动上传一次。搜索结果页本身会拦截被嵌入（跟ChatGPT、佐川一样的限制），
  // 所以只能新标签页打开，没法把结果也嵌在App里显示
  let searchUrl = null;
  async function prepareGoogleSearch(file) {
    searchGoogleBtn.disabled = true;
    searchGoogleBtn.textContent = '⏳ 正在准备搜索链接…';
    try {
      const formData = new FormData();
      formData.append('image', file, file.name);
      const res = await fetch('/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok || !data.url) throw new Error(data.error || '上传失败');

      const publicUrl = window.location.origin + data.url;
      searchUrl = 'https://www.google.com/searchbyimage?image_url=' + encodeURIComponent(publicUrl);
      searchGoogleBtn.disabled = false;
      searchGoogleBtn.textContent = '🔍 用谷歌搜这张图';
    } catch (err) {
      searchUrl = null;
      searchGoogleBtn.disabled = true;
      searchGoogleBtn.textContent = '搜索链接准备失败，可以手动去谷歌图片搜索上传';
    }
  }

  searchGoogleBtn.addEventListener('click', () => {
    if (searchUrl) window.open(searchUrl, '_blank', 'noopener,noreferrer');
  });

  async function handleNewFile(file) {
    if (!file) return;
    currentFile = file;

    capturedPreview.src = URL.createObjectURL(file);
    capturedPreview.style.display = 'block';
    cameraFeed.style.display = 'none';
    previewStage.classList.add('has-media');
    hidePlaceholder();

    captureBtn.style.display = 'none';
    snapBtn.style.display = 'none';
    galleryBtn.style.display = 'none';
    switchCameraBtn.style.display = 'none';
    retakeBtn.style.display = 'block';

    downloadFile(file);
    prepareGoogleSearch(file);

    try {
      await copyFileToClipboard(file);
      showStatus('✓ 已保存到本地下载文件夹，也顺手复制到了剪贴板——网站支持粘贴的话可以直接 Ctrl+V，不支持的话去"选择文件"里找刚下载的这张图', 'success');
      actionRow.classList.remove('show');
    } catch (err) {
      showStatus('✓ 已保存到本地下载文件夹，去网站"选择文件"里找刚下载的这张图上传就行（自动复制到剪贴板没成功：' + (err.message || '权限受限') + '，多数网站本来也只支持选文件，不影响使用）', 'warn');
      actionRow.classList.add('show');
    }
  }

  function reset() {
    stopCamera();
    currentFile = null;
    searchUrl = null;
    searchGoogleBtn.disabled = true;
    searchGoogleBtn.textContent = '⏳ 正在准备搜索链接…';
    capturedPreview.style.display = 'none';
    cameraFeed.style.display = 'none';
    previewStage.classList.remove('has-media');
    showPlaceholder('点"拍照"打开摄像头，或从相册选一张');
    captureBtn.style.display = 'block';
    snapBtn.style.display = 'none';
    galleryBtn.style.display = 'block';
    switchCameraBtn.style.display = 'none';
    retakeBtn.style.display = 'none';
    actionRow.classList.remove('show');
    hideStatus();
    galleryInput.value = '';
  }

  captureBtn.addEventListener('click', openCamera);
  snapBtn.addEventListener('click', snapPhoto);
  galleryBtn.addEventListener('click', () => galleryInput.click());
  retakeBtn.addEventListener('click', reset);
  switchCameraBtn.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    openCamera();
  });

  galleryInput.addEventListener('change', (e) => handleNewFile(e.target.files[0]));

  redownloadBtn.addEventListener('click', () => {
    if (currentFile) downloadFile(currentFile);
  });

  recopyBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    try {
      await copyFileToClipboard(currentFile);
      showStatus('✓ 复制到剪贴板成功了，可以直接粘贴了', 'success');
      actionRow.classList.remove('show');
    } catch (err) {
      showStatus('还是没能自动复制（' + (err.message || '权限受限') + '），用本地下载的那份文件去网站"选择文件"上传就行', 'warn');
    }
  });
</script>

</body>
</html>
