<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拍照搜图</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #f4f5f7;
    --panel-alt: #eef1f6;
    --border: #dde1e8;
    --text: #1a1d24;
    --muted: #6b7280;
    --accent: #3f6fd6;
    --accent-dark: #2f56b0;
    --ok: #2e9e5b;
    --warn: #d98a1f;
    --danger: #e5534b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    max-width: 560px;
    margin: 0 auto;
  }
  header { margin-bottom: 16px; }
  header h1 { font-size: 22px; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
  header p { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.6; }

  .camera-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  #camera-feed, #captured-preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #captured-preview { display: none; }
  .camera-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    text-align: center;
    padding: 0 20px;
  }
  .camera-placeholder .big-icon { font-size: 40px; }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .controls button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  #capture-btn { background: var(--accent); color: #fff; }
  #capture-btn:hover { background: var(--accent-dark); }
  #capture-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  #retake-btn {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border) !important;
    display: none;
  }
  #retake-btn:hover { border-color: var(--accent); color: var(--accent); }
  #switch-camera-btn {
    flex: 0 0 auto;
    width: 46px;
    background: var(--panel-alt);
    color: var(--muted);
    font-size: 17px;
    padding: 13px 0;
  }
  #switch-camera-btn:hover { background: var(--border); }

  #status-msg {
    display: none;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  #status-msg.show { display: block; }
  #status-msg.success { background: rgba(46, 158, 91, 0.12); color: var(--ok); border: 1px solid rgba(46, 158, 91, 0.3); }
  #status-msg.warn { background: rgba(217, 138, 31, 0.12); color: var(--warn); border: 1px solid rgba(217, 138, 31, 0.3); }
  #status-msg.error { background: rgba(229, 83, 75, 0.1); color: var(--danger); border: 1px solid rgba(229, 83, 75, 0.3); }

  .manual-copy-row {
    display: none;
    gap: 8px;
    margin-bottom: 10px;
  }
  .manual-copy-row.show { display: flex; }
  .manual-copy-row button {
    flex: 1;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
  }
  .manual-copy-row button:hover { border-color: var(--accent); color: var(--accent); }

  .hint-box {
    background: var(--panel);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
</style>
</head>
<body>

<header>
  <h1>📷 拍照搜图</h1>
  <p>拍一张照片，自动复制到剪贴板，切到搜索网站直接粘贴（Ctrl+V）就能以图搜图，不用先存文件再上传。</p>
</header>

<div id="status-msg"></div>

<div class="camera-stage">
  <video id="camera-feed" autoplay playsinline muted></video>
  <img id="captured-preview" alt="拍摄的照片" />
  <div class="camera-placeholder" id="camera-placeholder">
    <span class="big-icon">📷</span>
    <span id="placeholder-text">正在打开摄像头…</span>
  </div>
</div>

<div class="controls">
  <button id="switch-camera-btn" title="切换前后摄像头">🔄</button>
  <button id="capture-btn" disabled>拍照</button>
  <button id="retake-btn">重拍</button>
</div>

<div class="manual-copy-row" id="manual-copy-row">
  <button id="manual-copy-btn">再试一次复制到剪贴板</button>
  <button id="download-btn">下载这张照片</button>
</div>

<canvas id="capture-canvas" style="display:none;"></canvas>

<div class="hint-box">
  第一次使用需要允许浏览器访问摄像头。拍完的照片会自动尝试复制到系统剪贴板；如果你的浏览器/环境不支持自动复制，也可以长按（手机）或右键（电脑）照片手动复制，或者点"下载这张照片"保存下来再上传。
</div>

<script>
  const cameraFeed = document.getElementById('camera-feed');
  const capturedPreview = document.getElementById('captured-preview');
  const cameraPlaceholder = document.getElementById('camera-placeholder');
  const placeholderText = document.getElementById('placeholder-text');
  const captureBtn = document.getElementById('capture-btn');
  const retakeBtn = document.getElementById('retake-btn');
  const switchCameraBtn = document.getElementById('switch-camera-btn');
  const statusMsg = document.getElementById('status-msg');
  const manualCopyRow = document.getElementById('manual-copy-row');
  const manualCopyBtn = document.getElementById('manual-copy-btn');
  const downloadBtn = document.getElementById('download-btn');
  const captureCanvas = document.getElementById('capture-canvas');

  let stream = null;
  let facingMode = 'environment'; // 优先用后置摄像头，方便拍实物商品
  let lastBlob = null;

  function showStatus(text, type) {
    statusMsg.textContent = text;
    statusMsg.className = 'show ' + type;
  }
  function hideStatus() {
    statusMsg.className = '';
  }

  async function startCamera() {
    hideStatus();
    captureBtn.disabled = true;
    placeholderText.textContent = '正在打开摄像头…';
    cameraPlaceholder.style.display = 'flex';

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      placeholderText.textContent = '这个浏览器不支持访问摄像头';
      showStatus('当前浏览器/环境不支持调用摄像头，换个浏览器试试，或者用"下载"方式导入已有照片', 'error');
      return;
    }

    try {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode },
        audio: false,
      });
      cameraFeed.srcObject = stream;
      cameraPlaceholder.style.display = 'none';
      captureBtn.disabled = false;
    } catch (err) {
      let msg = '无法打开摄像头：' + (err.message || err.name || '未知错误');
      if (err.name === 'NotAllowedError') {
        msg = '摄像头权限被拒绝了，去浏览器设置里允许这个网站访问摄像头，然后刷新页面重试';
      } else if (err.name === 'NotFoundError') {
        msg = '没有找到可用的摄像头设备';
      }
      placeholderText.textContent = '摄像头打不开';
      showStatus(msg, 'error');
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
  }

  async function copyBlobToClipboard(blob) {
    if (!navigator.clipboard || !window.ClipboardItem) {
      throw new Error('浏览器不支持图片剪贴板API');
    }
    await navigator.clipboard.write([
      new ClipboardItem({ [blob.type]: blob }),
    ]);
  }

  function capturePhoto() {
    if (!stream) return;
    const canvas = captureCanvas;
    canvas.width = cameraFeed.videoWidth;
    canvas.height = cameraFeed.videoHeight;
    canvas.getContext('2d').drawImage(cameraFeed, 0, 0);

    canvas.toBlob(async (blob) => {
      if (!blob) {
        showStatus('拍照失败，请重试', 'error');
        return;
      }
      lastBlob = blob;
      capturedPreview.src = URL.createObjectURL(blob);
      capturedPreview.style.display = 'block';
      cameraFeed.style.display = 'none';
      captureBtn.style.display = 'none';
      retakeBtn.style.display = 'block';
      switchCameraBtn.style.display = 'none';
      stopCamera();

      try {
        await copyBlobToClipboard(blob);
        showStatus('✓ 已复制到剪贴板，切到搜索网站直接粘贴（Ctrl+V）就行', 'success');
        manualCopyRow.classList.remove('show');
      } catch (err) {
        // 自动复制失败时的兜底：提示手动操作，同时给出"再试一次"和"下载"两个选项
        showStatus('自动复制到剪贴板没成功（' + (err.message || '权限受限') + '），可以试试下面的按钮，或者长按/右键照片手动复制', 'warn');
        manualCopyRow.classList.add('show');
      }
    }, 'image/png');
  }

  function retakePhoto() {
    lastBlob = null;
    capturedPreview.style.display = 'none';
    cameraFeed.style.display = 'block';
    captureBtn.style.display = 'block';
    retakeBtn.style.display = 'none';
    switchCameraBtn.style.display = 'block';
    manualCopyRow.classList.remove('show');
    hideStatus();
    startCamera();
  }

  captureBtn.addEventListener('click', capturePhoto);
  retakeBtn.addEventListener('click', retakePhoto);

  switchCameraBtn.addEventListener('click', () => {
    facingMode = facingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  manualCopyBtn.addEventListener('click', async () => {
    if (!lastBlob) return;
    try {
      await copyBlobToClipboard(lastBlob);
      showStatus('✓ 已复制到剪贴板，切到搜索网站直接粘贴（Ctrl+V）就行', 'success');
      manualCopyRow.classList.remove('show');
    } catch (err) {
      showStatus('还是没能自动复制（' + (err.message || '权限受限') + '），长按/右键照片手动复制，或者点"下载"保存下来', 'warn');
    }
  });

  downloadBtn.addEventListener('click', () => {
    if (!lastBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(lastBlob);
    a.download = `拍照搜图-${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  startCamera();
</script>

</body>
</html>
